joy_node:
    ros__parameters:
        device_id: 0
        deadzone: 0.05
        autorepeat_rate: 20.0

teleop_node:
    ros__parameters:
        publish_stamped_twist: true   # /cmd_vel is TwistStamped on Jazzy
        frame_id: base_link
        axis_linear:
            x: 1        # left stick vertical
        scale_linear:
            x: 0.2       # m/s, TurtleBot3 Burger max ~0.22 m/s
        axis_angular:
            yaw: 0       # left stick horizontal
        scale_angular:
            yaw: 1.5     # rad/s, Burger max ~2.84 rad/s
        # Confirmed via /joy echo on this specific controller - L2/R2 report
        # as axes only (no digital button), L1 is buttons[9].
        enable_button: 9   # L1 - deadman switch, must hold to drive

joy_speed_control_node:
    ros__parameters:
        teleop_node_name: teleop_node
        step_factor: 0.1
        # Must match teleop_node's scale_linear.x / scale_angular.yaw above -
        # this is the starting point before any D-pad speed adjustments.
        initial_linear: 0.2
        initial_angular: 1.5
        min_linear: 0.05
        max_linear: 0.22
        min_angular: 0.2
        max_angular: 2.84
