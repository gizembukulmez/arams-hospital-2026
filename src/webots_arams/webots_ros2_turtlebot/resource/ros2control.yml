controller_manager:
  ros__parameters:
    update_rate: 50

    diffdrive_controller:
      type: diff_drive_controller/DiffDriveController

    joint_state_broadcaster:
      type: joint_state_broadcaster/JointStateBroadcaster

diffdrive_controller:
  ros__parameters:
    left_wheel_names: ["left wheel motor"]
    right_wheel_names: ["right wheel motor"]

    wheel_separation: 0.16
    wheel_radius: 0.033

    # The real separation between wheels is not resulting in a perfect odometry
    wheel_separation_multiplier: 1.112

    use_stamped_vel: false
    base_frame_id: "base_link"

    # Publish odom below the 50 Hz sim step rate so two odom messages can never
    # share the same sim timestamp. Cartographer aborts on duplicate stamps
    # (map_by_time.h: "Check failed: data.time > prev->first"), which made SLAM
    # crash intermittently.
    publish_rate: 20.0
    
    linear:
      x:
        max_velocity: 0.2 # Maximal speed of turtlebot

joint_state_broadcaster:
  ros__parameters:
    extra_joints:
      - LDS-01_secondary_motor
      - LDS-01_main_motor
